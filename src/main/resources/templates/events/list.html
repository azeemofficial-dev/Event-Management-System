<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Events</title>
</head>
<body>
    <div th:replace="~{layout/base :: layout('Events',  ~{::content})}">
        <div th:fragment="content">

            <!-- Hero Section -->
            <div class="hero-section text-center rounded-4 mb-4 p-5">
                <h1><i class="bi bi-calendar-event me-2"></i>Upcoming Events</h1>
                <p class="lead mb-3">Discover and register for exciting campus events</p>

                <!-- Search Bar -->
                <form th:action="@{/events}" method="get" class="d-flex justify-content-center">
                    <div class="input-group" style="max-width: 500px;">
                        <input type="text" class="form-control" name="search"
                               th:value="${search}" placeholder="Search events...">
                        <button class="btn btn-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Success/Error messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Event Cards Grid -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="event : ${events}">
                    <div class="card event-card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${event.name}">Event Name</h5>
                            <p class="card-text text-muted"
                               th:text="${#strings.abbreviate(event.description, 120)}">Description</p>

                            <div class="mb-2">
                                <i class="bi bi-calendar3 text-primary me-1"></i>
                                <span th:text="${event.date}">Date</span>
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-clock text-primary me-1"></i>
                                <span th:text="${event.startTime}">Start</span> –
                                <span th:text="${event.endTime}">End</span>
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-geo-alt text-primary me-1"></i>
                                <span th:text="${event.location}">Location</span>
                            </div>
                            <div class="mb-3">
                                <span class="badge bg-success" th:if="${!event.full}">
                                    <span th:text="${event.capacity - event.registeredCount}">0</span> spots left
                                </span>
                                <span class="badge bg-danger" th:if="${event.full}">Full</span>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 pb-3">
                            <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-primary w-100">
                                <i class="bi bi-eye me-1"></i> View Details
                            </a>

                            <!-- Admin actions -->
                            <div sec:authorize="hasRole('ADMIN')" class="mt-2 d-flex gap-2">
                                <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                                   class="btn btn-sm btn-outline-warning flex-fill">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <a th:href="@{/admin/events/delete/{id}(id=${event.id})}"
                                   class="btn btn-sm btn-outline-danger flex-fill"
                                   onclick="return confirm('Delete this event?')">
                                    <i class="bi bi-trash"></i> Delete
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- No events message -->
            <div th:if="${#lists.isEmpty(events)}" class="text-center py-5 text-muted">
                <i class="bi bi-calendar-x" style="font-size: 3rem;"></i>
                <p class="mt-3">No upcoming events found.</p>
            </div>

        </div>
    </div>
</body>
</html>
