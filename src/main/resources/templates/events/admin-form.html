<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Form</title>
</head>
<body>
    <div th:replace="~{layout/base :: layout(${isEdit} ? 'Edit Event' : 'New Event',  ~{::content})}">
        <div th:fragment="content">

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <h2 class="mb-4">
                                <i class="bi bi-calendar-plus text-primary me-2"></i>
                                <span th:if="${isEdit}">Edit Event</span>
                                <span th:unless="${isEdit}">Create New Event</span>
                            </h2>

                            <form th:action="@{/admin/events/save}" th:object="${event}" method="post">
                                <!-- Hidden ID for edit -->
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{registeredCount}">

                                <div class="mb-3">
                                    <label for="name" class="form-label">Event Name *</label>
                                    <input type="text" class="form-control" id="name"
                                           th:field="*{name}" required>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}"
                                         th:errors="*{name}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" rows="4"
                                              th:field="*{description}"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="date" class="form-label">Date *</label>
                                        <input type="date" class="form-control" id="date"
                                               th:field="*{date}" required>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('date')}"
                                             th:errors="*{date}"></div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="startTime" class="form-label">Start Time *</label>
                                        <input type="time" class="form-control" id="startTime"
                                               th:field="*{startTime}" required>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('startTime')}"
                                             th:errors="*{startTime}"></div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="endTime" class="form-label">End Time *</label>
                                        <input type="time" class="form-control" id="endTime"
                                               th:field="*{endTime}" required>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('endTime')}"
                                             th:errors="*{endTime}"></div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label for="location" class="form-label">Location *</label>
                                        <input type="text" class="form-control" id="location"
                                               th:field="*{location}" required>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('location')}"
                                             th:errors="*{location}"></div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="capacity" class="form-label">Capacity *</label>
                                        <input type="number" class="form-control" id="capacity"
                                               th:field="*{capacity}" min="1" required>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('capacity')}"
                                             th:errors="*{capacity}"></div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-lg me-1"></i>
                                        <span th:if="${isEdit}">Update Event</span>
                                        <span th:unless="${isEdit}">Create Event</span>
                                    </button>
                                    <a th:href="@{/admin/events}" class="btn btn-outline-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
