<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Registrations</title>
</head>
<body>
    <div th:replace="~{layout/base :: layout('My Registrations',  ~{::content})}">
        <div th:fragment="content">

            <h2 class="mb-4">
                <i class="bi bi-bookmark-check text-primary me-2"></i>My Registrations
            </h2>

            <!-- Success/Error messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${#lists.isEmpty(registrations)}" class="text-center py-5 text-muted">
                <i class="bi bi-bookmark-x" style="font-size: 3rem;"></i>
                <p class="mt-3">You haven't registered for any events yet.</p>
                <a th:href="@{/events}" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i> Browse Events
                </a>
            </div>

            <div class="row row-cols-1 row-cols-md-2 g-4" th:unless="${#lists.isEmpty(registrations)}">
                <div class="col" th:each="reg : ${registrations}">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${reg.event.name}">Event Name</h5>
                            <div class="mb-2">
                                <i class="bi bi-calendar3 text-primary me-1"></i>
                                <span th:text="${reg.event.date}">Date</span>
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-clock text-primary me-1"></i>
                                <span th:text="${reg.event.startTime}">Start</span> –
                                <span th:text="${reg.event.endTime}">End</span>
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-geo-alt text-primary me-1"></i>
                                <span th:text="${reg.event.location}">Location</span>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted">
                                    Registered on: <span th:text="${#temporals.format(reg.registeredAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
                                </small>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 pb-3 d-flex flex-wrap gap-2">
                            <a th:href="@{/events/{id}(id=${reg.event.id})}" class="btn btn-outline-primary flex-fill">
                                <i class="bi bi-eye me-1"></i> View Event
                            </a>
                            <a th:href="@{/registrations/pass/{id}(id=${reg.id})}" class="btn btn-primary flex-fill">
                                <i class="bi bi-ticket-perforated me-1"></i> View Pass
                            </a>
                            <form th:action="@{/registrations/cancel/{id}(id=${reg.event.id})}" method="post" class="flex-fill">
                                <button type="submit" class="btn btn-outline-danger w-100"
                                        onclick="return confirm('Cancel this registration?')">
                                    <i class="bi bi-x-circle me-1"></i> Cancel
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
